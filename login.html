<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Gestión de Stock</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#faf6ef">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
    <script src="https://kit.fontawesome.com/0609dfb132.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-(--superficie) border-b border-(--borde)">
        <nav class="flex justify-between items-center px-4 py-3 sm:px-6 sm:py-4 lg:px-10">
            <a class="flex items-center gap-2.5" href="./index.html" aria-label="Volver al inicio">
                <img class="block h-9 sm:h-11 w-auto" src="./images/c0867a9a-c574-4d23-9943-410cc741d8ca.png" alt="Logo de Gestión De Stock">
                <span class="text-2xl sm:text-3xl font-extrabold tracking-[0.02em] text-(--texto)"><span class="text-[#1a7bff]">G</span>estion</span>
            </a>
            <a class="inline-flex items-center gap-2 text-sm px-4 py-2 rounded-full border border-(--borde) text-(--texto) transition hover:bg-(--fondo) hover:text-(--acento-hover)" href="./index.html">
                <i class="fa-solid fa-arrow-left text-xs"></i> Volver al inicio
            </a>
        </nav>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-10 sm:px-6">
        <section id="iniciar-sesion" class="w-full max-w-sm bg-(--superficie) border border-(--borde) rounded-xl p-6 sm:p-8 shadow-[0_8px_24px_rgba(59,42,32,0.06)]">
            <h1 class="text-2xl font-bold text-(--texto) text-center">Iniciar sesión</h1>
            <p class="mt-1 text-sm text-(--texto-suave) text-center">Ingresá para gestionar tu stock.</p>

            <form id="form-login" class="mt-6 flex flex-col gap-4" novalidate>
                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-medium text-(--texto)" for="email">Email</label>
                    <input class="w-full px-3.5 py-2.5 text-sm rounded-lg bg-(--fondo) border border-(--borde) text-(--texto) placeholder:text-(--texto-suave)/60 focus:outline-none focus:border-(--acento) focus:ring-2 focus:ring-(--acento)/30" type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email" required>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-medium text-(--texto)" for="password">Contraseña</label>
                    <div class="relative">
                        <input class="w-full pl-3.5 pr-11 py-2.5 text-sm rounded-lg bg-(--fondo) border border-(--borde) text-(--texto) placeholder:text-(--texto-suave)/60 focus:outline-none focus:border-(--acento) focus:ring-2 focus:ring-(--acento)/30" type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
                        <button id="toggle-password" class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-(--texto-suave) cursor-pointer hover:text-(--acento-hover)" type="button" aria-label="Mostrar contraseña">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="inline-flex items-center gap-2 text-(--texto-suave) cursor-pointer">
                        <input class="size-4 accent-(--acento-hover)" type="checkbox" name="recordarme"> Recordarme
                    </label>
                    <a class="text-(--acento-hover) hover:underline" href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <p id="mensaje-login" class="hidden text-sm text-center text-(--stock-agotado)" role="alert"></p>

                <button class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-full bg-(--acento-hover) text-white font-semibold cursor-pointer transition hover:bg-(--texto) focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--acento-hover)" type="submit">
                    Ingresar <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>

            <p class="mt-6 text-sm text-center text-(--texto-suave)">
                ¿No tenés cuenta? <a class="font-medium text-(--acento-hover) hover:underline" href="#">Registrate</a>
            </p>
        </section>
    </main>

    <footer class="bg-(--texto) text-[#e8dcc8]/70">
        <p class="px-4 py-4 text-xs text-center">© 2026 Gestión de Stock. Todos los derechos reservados.</p>
    </footer>

    <script src="./login.js"></script>
</body>
</html>
